name: Instaladores

# Al subir una etiqueta `vX.Y.Z` se crean los instaladores de Windows, macOS y
# Linux y se publican en Releases junto con sus sumas SHA-256 (la actualización
# dentro de la app las comprueba). En los PR que tocan los instaladores se
# construyen igualmente, sin publicar nada, para ver que funcionan.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/release.yml"
      - "apps/omni-gui/build.rs"
      - "apps/omni-gui/Cargo.toml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  windows:
    name: Windows (instalador y portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Versión
        id: v
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Compilar
        run: cargo build --release --locked -p omni-cli -p omni-gui -p omnid
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" installer\windows\omniload.iss
      - name: Versión portable (zip)
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          Compress-Archive -Path target\release\omniload.exe, target\release\omnid.exe, target\release\omni.exe, LICENSE `
            -DestinationPath "dist\OmniLoad-$v-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux (.deb, .AppImage y .tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev
      - name: Versión
        id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Compilar
        run: cargo build --release --locked -p omni-cli -p omni-gui -p omnid
      - name: Paquetes
        run: installer/linux/build-packages.sh "${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Versión
        id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Compilar
        run: cargo build --release --locked --target ${{ matrix.target }} -p omni-cli -p omni-gui -p omnid
      - name: .dmg
        run: installer/macos/build-dmg.sh "${{ steps.v.outputs.version }}" "${{ matrix.arch }}" "target/${{ matrix.target }}/release"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  publicar:
    name: Publicar en Releases
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Comprobar que la etiqueta coincide con la versión
        run: |
          ver="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v$ver" = "${GITHUB_REF_NAME}" || { echo "La etiqueta ${GITHUB_REF_NAME} no es la versión $ver"; exit 1; }
      - name: Sumas SHA-256
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si la release ya existe (creada a mano en la web), solo se suben
          # los archivos.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "OmniLoad ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi
