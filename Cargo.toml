[workspace]
resolver = "3"
members = [
    "crates/omni-core",
    "crates/omni-grab",
    "crates/omni-testserver",
    "apps/omni-cli",
    "apps/omni-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Danijimzzz/OmniLoad"

[workspace.dependencies]
omni-core = { path = "crates/omni-core" }
omni-grab = { path = "crates/omni-grab" }
omni-testserver = { path = "crates/omni-testserver" }

anyhow = "1"
arboard = { version = "3", default-features = false }
axum = "0.8"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
fs4 = "1"
futures-util = "0.3"
hex = "0.4"
indicatif = "0.18"
percent-encoding = "2"
rfd = "0.15"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.16"
slint-build = "1.16"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
