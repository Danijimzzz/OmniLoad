[workspace]
resolver = "3"
members = [
    "crates/omni-core",
    "crates/omni-grab",
    "crates/omni-hosts",
    "crates/omni-api",
    "crates/omni-store",
    "crates/omni-queue",
    "crates/omni-testserver",
    "apps/omni-cli",
    "apps/omni-gui",
    "apps/omnid",
]

[workspace.package]
version = "0.4.0-pr11"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Danijimzzz/OmniLoad"

[workspace.dependencies]
omni-api = { path = "crates/omni-api" }
omni-core = { path = "crates/omni-core" }
omni-grab = { path = "crates/omni-grab" }
omni-hosts = { path = "crates/omni-hosts" }
omni-queue = { path = "crates/omni-queue" }
omni-store = { path = "crates/omni-store" }
omni-testserver = { path = "crates/omni-testserver" }

aes = "0.8"
anyhow = "1"
arboard = { version = "3", default-features = false }
axum = "0.8"
base64 = "0.22"
bytes = "1"
cbc = "0.1"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctr = "0.9"
dirs = "6"
fs4 = "1"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
indicatif = "0.18"
# Bandeja del sistema en Linux/BSD (StatusNotifierItem por D-Bus, sin GTK).
ksni = "0.3"
# Notificaciones del sistema al terminar descargas.
notify-rust = "4.17"
percent-encoding = "2"
png = "0.18"
rfd = "0.15"
# 0.40: la última que compila con Rust 1.88. "bundled" compila SQLite dentro
# del programa, así no hace falta instalar nada en Windows, macOS ni Linux.
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "~1.16"
slint-build = "~1.16"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "signal", "process", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
# Bandeja del sistema en Windows y macOS (Win32 y AppKit, sin navegador).
tray-icon = { version = "0.24", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
