[package]
name = "omni-gui"
description = "Interfaz gráfica de OmniLoad (Slint, nativa)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "omniload"
path = "src/main.rs"

[dependencies]
arboard.workspace = true
dirs.workspace = true
getrandom.workspace = true
hex.workspace = true
notify-rust.workspace = true
omni-core.workspace = true
omni-grab.workspace = true
omni-api.workspace = true
omni-queue.workspace = true
png.workspace = true
reqwest.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
sha2.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# Icono en la bandeja del sistema (ver src/tray.rs).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon.workspace = true

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
ksni.workspace = true

[dev-dependencies]
omni-testserver.workspace = true
tempfile.workspace = true

[build-dependencies]
slint-build.workspace = true

# Icono y datos del programa dentro de omniload.exe (ver build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
